services:
  postgres:
    image: postgres:16-alpine
    container_name: clubverso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clubverso
      POSTGRES_PASSWORD: clubverso
      POSTGRES_DB: clubverso
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubverso"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clubverso-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Opcional: Adminer para inspeção rápida
  adminer:
    image: adminer:latest
    container_name: clubverso-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
